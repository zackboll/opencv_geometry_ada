name: Ada API Documentation

on:
  # Every pull request, including stacked documentation PRs whose base is
  # another feature branch. Pull-request runs never receive Pages permissions.
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Serialize main publication; cancel superseded runs before they can deploy.
concurrency:
  group: documentation-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    needs: current-trust
    if: always() && (github.event_name == 'pull_request' || needs.current-trust.result == 'success')
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: geometry
    steps:
      - name: Checkout Geometry
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: geometry
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout independent build-input authority
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          path: build-policy
          fetch-depth: 0
          persist-credentials: false
      - name: Preflight before candidate dependency installation or Alire actions
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          base=$(git -C ../build-policy rev-parse HEAD)
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git merge-base --is-ancestor "$base" "$CANDIDATE_SHA"
          if test "$GITHUB_EVENT_NAME" = push; then
            test "$GITHUB_REF" = refs/heads/main
          fi
          if test "$GITHUB_EVENT_NAME" != pull_request; then
            # current-trust tests the actual merged policy before publication.
            test "$GITHUB_REF" = refs/heads/main
            git -C ../build-policy checkout --detach "$CANDIDATE_SHA"
          fi
          if test -f ../build-policy/scripts/validate_gnatdoc_inputs.py; then
            python3 -I ../build-policy/scripts/validate_gnatdoc_inputs.py \
              --candidate "$GITHUB_WORKSPACE/geometry"
          else
            # Older branch bases have no Python preflight. Compare inputs
            # directly, without loading candidate code or a SHA allowlist.
            for name in docs/requirements.txt alire.toml tests/alire.toml; do
              test ! -L "$name"
              test ! -L "$(dirname "$name")"
              cmp -- "$name" "../build-policy/$name"
            done
          fi
      - name: Checkout immutable historical regression source
        uses: actions/checkout@v4
        with:
          ref: ec4d689eac748b7837abd4c3754c3090ca4bf814
          path: historical
          persist-credentials: false
      # The opencv_core 0.5.0 release commit (tag 0.5.0), temporarily
      # pinned as in the cross-platform CI; scripts/generate_docs.sh
      # verifies it.
      - name: Checkout Core
        uses: actions/checkout@v4
        with:
          repository: zackboll/opencv_core_ada
          ref: f8aef00c5366b4275ccd3d934f9c73ea5b83cd4f
          path: core
          persist-credentials: false
      - name: Record checkout identities
        run: |
          echo "Geometry: $(git rev-parse HEAD)"
          echo "Core:     $(git -C ../core rev-parse HEAD)"
      - name: Install native prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential libopencv-dev pkg-config unzip python3
      - name: Install Alire 2.1.1
        run: |
          curl --fail --location --output /tmp/alire.zip https://github.com/alire-project/alire/releases/download/v2.1.1/alr-2.1.1-bin-x86_64-linux.zip
          unzip /tmp/alire.zip -d /tmp/alire
          sudo install -m 0755 /tmp/alire/bin/alr /usr/local/bin/alr
      - name: Select qualified compiler and project tools
        run: |
          alr -n --force toolchain --select gnat_native=16.1.0 gprbuild=26.0.1
          alr toolchain
      - name: Pin the qualified Core checkout
        run: |
          alr -n pin opencv_core --use=../core
          alr -n with --solve
      - name: Install qualified documentation-only Markdown renderer
        run: |
          python3 -m venv .doc-tools/markdown
          .doc-tools/markdown/bin/pip install -r ../build-policy/docs/requirements.txt
          curl --fail --location --output /tmp/ada_gnatdoc_enhancer-0.1.5-py3-none-any.whl https://github.com/zackboll/ada-gnatdoc-enhancer/releases/download/v0.1.5/ada_gnatdoc_enhancer-0.1.5-py3-none-any.whl
          .doc-tools/markdown/bin/python -I ../build-policy/scripts/gnatdoc_migration_policy.py --wheel /tmp/ada_gnatdoc_enhancer-0.1.5-py3-none-any.whl --install
          echo "DOC_PYTHON=$GITHUB_WORKSPACE/geometry/.doc-tools/markdown/bin/python" >> "$GITHUB_ENV"
      - name: Generate and validate public API and guides
        run: |
          sh scripts/generate_docs.sh
          "$DOC_PYTHON" -I ../build-policy/scripts/gnatdoc_migration_policy.py --wheel /tmp/ada_gnatdoc_enhancer-0.1.5-py3-none-any.whl
      - name: Generate historical output and run unchanged 232 regression tests
        working-directory: historical
        env:
          GNATDOC_PREFIX: ${{ github.workspace }}/geometry/.doc-tools/gnatdoc-26.0.0
        run: |
          alr -n pin opencv_core --use=../core
          sh scripts/generate_docs.sh
          PYTHONPATH="$PWD/scripts" "$DOC_PYTHON" -m unittest -v \
            test_check_comment_only test_check_doc_coverage \
            test_compare_gnatdoc_warnings test_gnatdoc_guides \
            test_gnatdoc_navigation test_investigate_shared_gnatdoc_types \
            test_link_gnatdoc_types test_validate_docs
      - name: Qualify deterministic fresh generation and idempotent enhancement
        run: |
          cp -a _site /tmp/documentation-first
          sh scripts/generate_docs.sh
          diff -r /tmp/documentation-first _site
          "$DOC_PYTHON" -m ada_gnatdoc_enhancer enhance --config docs/gnatdoc-enhancer.toml --source-root . --site _site
          "$DOC_PYTHON" -m ada_gnatdoc_enhancer verify --config docs/gnatdoc-enhancer.toml --source-root . --site _site
          diff -r /tmp/documentation-first _site
          "$DOC_PYTHON" -I ../build-policy/scripts/gnatdoc_migration_policy.py --wheel /tmp/ada_gnatdoc_enhancer-0.1.5-py3-none-any.whl
      - name: Compile and run the landing-page and guide examples
        run: |
          alr exec -- gprbuild -P docs/example.gpr
          obj/docs-example/example
          alr exec -- gprbuild -P docs/examples/examples.gpr
          for example in contours_and_moments fitting_and_intersections \
              affine_and_perspective delaunay_and_voronoi compatibility_and_safety; do
            "obj/docs-examples/$example"
          done
      # Documentation-only Phase 1 fixture, not Geometry's Ada dependency.
      # Keep the production/source-resolution Core 0.5.0 checkout above intact.
      - name: Checkout immutable Core declaration-router documentation fixture
        uses: actions/checkout@v4
        with:
          repository: zackboll/opencv_core_ada
          ref: ccc2190f9bf0712d65a2b9d2983cde7ce68b4bae
          path: core-navigation
          persist-credentials: false
      - name: Generate actual Core browser fixture
        working-directory: core-navigation
        env:
          GNATDOC_PREFIX: ${{ github.workspace }}/geometry/.doc-tools/gnatdoc-26.0.0
        run: sh scripts/generate_docs.sh
      - name: Qualify cross-repository declaration navigation in Chromium
        working-directory: historical
        run: |
          npm install --prefix /tmp/doc-browser --no-package-lock playwright@1.64.1
          /tmp/doc-browser/node_modules/.bin/playwright install --with-deps chromium
          export PLAYWRIGHT_MODULE=/tmp/doc-browser/node_modules/playwright
          export CHROME=$(node -e 'console.log(require(process.env.PLAYWRIGHT_MODULE).chromium.executablePath())')
          export DOC_URL=http://127.0.0.1:8073/
          export CORE_DOC_URL=http://127.0.0.1:8074/
          export DOC_EVIDENCE=${{ github.workspace }}/geometry/obj/docs/browser
          export DOC_TRACE=1
          python3 -m http.server 8073 --bind 127.0.0.1 --directory _site &
          geometry_server=$!
          python3 -m http.server 8074 --bind 127.0.0.1 --directory ../core-navigation/_site &
          core_server=$!
          trap 'kill "$geometry_server" "$core_server"' EXIT
          curl --fail --retry 10 --retry-connrefused --retry-delay 1 "$DOC_URL" --output /dev/null
          curl --fail --retry 10 --retry-connrefused --retry-delay 1 "$CORE_DOC_URL" --output /dev/null
          node scripts/test_core_type_links_browser.cjs
          node scripts/test_gnatdoc_presentation_browser.cjs
          node scripts/test_gnatdoc_navigation_browser.cjs
          node scripts/test_gnatdoc_guides_browser.cjs
      - name: Upload cross-repository browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: declaration-navigation-${{ github.event.pull_request.head.sha || github.sha }}
          path: geometry/obj/docs/browser/
          if-no-files-found: warn
      - name: Upload review artifact
        uses: actions/upload-artifact@v4
        with:
          name: ada-api-${{ github.event.pull_request.head.sha || github.sha }}
          path: geometry/_site/
          if-no-files-found: error
      - name: Upload generator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gnatdoc-diagnostics-${{ github.event.pull_request.head.sha || github.sha }}
          path: geometry/obj/docs/gnatdoc.log
      - name: Configure Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: geometry/_site/

  pr-trust:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/documentation-additive-policy.yml

  acceptance:
    name: Documentation policy acceptance
    if: always()
    needs: [build, pr-trust, current-trust]
    runs-on: ubuntu-24.04
    steps:
      - name: Require documentation build and independent policy acceptance
        env:
          BUILD: ${{ needs.build.result }}
          TRUST: ${{ needs.pr-trust.result }}
          CURRENT: ${{ needs.current-trust.result }}
        run: |
          test "$BUILD" = success
          if test "$GITHUB_EVENT_NAME" = pull_request; then
            test "$TRUST" = success
          else
            test "$CURRENT" = success
          fi

  current-trust:
    # Main validates the actual merged policy; no predecessor approval envelope.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    uses: ./.github/workflows/documentation-additive-policy.yml

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [build, current-trust]
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
