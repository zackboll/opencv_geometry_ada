name: Cross-Platform Geometry CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux-x86_64:
    name: Linux x86_64 / Core ${{ matrix.core.version }}
    strategy:
      fail-fast: false
      matrix:
        # The manifest requires opencv_core >=0.5.0 & <0.6.0: the Core 0.5.0
        # release commit (tag 0.5.0).
        core:
          - version: 0.5.0
            commit: f8aef00c5366b4275ccd3d934f9c73ea5b83cd4f
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: geometry

    steps:
      - name: Checkout Geometry
        uses: actions/checkout@v4
        with:
          path: geometry

      - name: Checkout Core
        uses: actions/checkout@v4
        with:
          repository: zackboll/opencv_core_ada
          ref: ${{ matrix.core.commit }}
          path: core

      - name: Verify two-checkout layout
        run: |
          set -eu
          test -f ../core/alire.toml
          echo "Geometry: $(git rev-parse HEAD)"
          echo "Core:    $(git -C ../core rev-parse HEAD)"

      - name: Install OpenCV and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libopencv-dev \
            pkg-config

      - name: Set up Alire
        uses: alire-project/setup-alire@latest
        with:
          version: "2.1.1"
          toolchain: "gnat_native gprbuild"

      - name: Select Ada toolchain
        run: |
          set -eu
          alr -n --force toolchain --select \
            gnat_native=16.1.0 \
            gprbuild=26.0.1
          alr toolchain

      - name: Report OpenCV
        run: |
          pkg-config --modversion opencv5 2>/dev/null || \
          pkg-config --modversion opencv4 2>/dev/null || \
          pkg-config --modversion opencv

      - name: Select and verify exact Core release
        run: |
          test "$(git -C ../core rev-parse HEAD)" = "${{ matrix.core.commit }}"
          alr -n pin opencv_core --use=../core
          alr -n with --solve
          alr -n -C tests with --solve
          alr -n -C tests exec -- sh -c \
            'test "$(git -C "$OPENCV_CORE_ALIRE_PREFIX" rev-parse HEAD)" = "${{ matrix.core.commit }}"'

      - name: Build Geometry
        run: alr -n build

      - name: Verify OpenCV 4 backend
        run: |
          grep 'OpenCV_Major := "4"' config/opencv_geometry_install.gpr
          grep 'Native_Geometry_Module := "imgproc"' config/opencv_geometry_install.gpr
          grep 'OpenCV_Geometry_Link_Option := "-lopencv_imgproc"' config/opencv_geometry_install.gpr

      - name: Run Geometry tests
        run: |
          set +e
          set -o pipefail
          alr -n -C tests run 2>&1 | tee geometry-tests.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            failures=$(grep -E '^FAIL |^    ' geometry-tests.log | tr '\n' ' ')
            echo "::error title=Geometry test failure::${failures}"
            exit "$status"
          fi

      - name: Run native fault-injection tests
        run: sh scripts/run_native_tests.sh

      - name: Run independent Core 0.5.0 consumer
        if: matrix.core.version == '0.5.0'
        run: |
          # Avoid conflicting path/URL pins in the consumer's project closure:
          # drop the temporary path pin by restoring the manifest. `alr pin
          # --unpin` would have to solve without the pin, which fails while
          # Core 0.5.0 is not in the community index.
          git checkout -- alire.toml
          alr -n -C tests/compatibility run
          alr -n pin opencv_core --use=../core

      # Keep this the last Linux step: the validation profile persists in
      # the tests crate's Alire settings and would change later test runs.
      - name: Run Geometry tests with validity checks
        run: |
          alr -n -C tests build --profiles=opencv_geometry=validation
          set +e
          set -o pipefail
          tests/bin/tests 2>&1 | tee geometry-validation-tests.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            failures=$(grep -E '^FAIL |^ERROR |^    ' geometry-validation-tests.log | tr '\n' ' ')
            echo "::error title=Geometry validation-profile failure::${failures}"
            exit "$status"
          fi

  macos-arm64:
    name: macOS ARM64 / Core ${{ matrix.core.version }}
    strategy:
      fail-fast: false
      matrix:
        core:
          - version: 0.5.0
            commit: f8aef00c5366b4275ccd3d934f9c73ea5b83cd4f
    runs-on: macos-latest
    defaults:
      run:
        working-directory: geometry

    steps:
      - name: Checkout Geometry
        uses: actions/checkout@v4
        with:
          path: geometry

      - name: Checkout Core
        uses: actions/checkout@v4
        with:
          repository: zackboll/opencv_core_ada
          ref: ${{ matrix.core.commit }}
          path: core

      - name: Verify two-checkout layout
        run: |
          set -eu
          test -f ../core/alire.toml
          echo "Geometry: $(git rev-parse HEAD)"
          echo "Core:    $(git -C ../core rev-parse HEAD)"
          uname -a
          sw_vers

      - name: Set up Alire
        uses: alire-project/setup-alire@latest
        with:
          version: "2.1.1"
          toolchain: "gnat_native gprbuild"

      - name: Select Ada toolchain
        run: |
          set -eu
          alr -n --force toolchain --select \
            gnat_native=16.1.0 \
            gprbuild=26.0.1
          alr toolchain

      - name: Install Homebrew OpenCV
        run: brew install opencv

      - name: Configure Homebrew pkg-config path
        run: |
          set -eu
          opencv_prefix="$(brew --prefix opencv)"
          brew_pkgconfig="$(brew --prefix)/lib/pkgconfig"
          opencv_pkgconfig="${opencv_prefix}/lib/pkgconfig"
          pkg_path=""

          if [ -d "${brew_pkgconfig}" ]; then
            pkg_path="${brew_pkgconfig}"
          fi

          if [ -d "${opencv_pkgconfig}" ]; then
            pkg_path="${pkg_path:+${pkg_path}:}${opencv_pkgconfig}"
          fi

          if [ -n "${PKG_CONFIG_PATH:-}" ]; then
            pkg_path="${pkg_path:+${pkg_path}:}${PKG_CONFIG_PATH}"
          fi

          echo "PKG_CONFIG_PATH=${pkg_path}" >> "$GITHUB_ENV"

      # GNAT 16.1.0 links with its own bundled ld, which rejects the .tbd
      # stubs of the macOS 27 SDK (target arm64e.x1; see
      # https://github.com/alire-project/GNAT-FSF-builds/issues/112). Runner
      # images with Command Line Tools 27 make that SDK the GNAT driver's
      # default sysroot. Every later GNAT compile and link therefore uses the
      # active Xcode's macOS 26.x SDK, through SDKROOT (which the GCC driver
      # takes as its sysroot) and LIBRARY_PATH. There is no fallback: the
      # job fails if no compatible SDK is installed.
      - name: Select macOS SDK for the GNAT linker
        run: |
          set -eu

          echo "=== Xcode and Command Line Tools ==="
          developer_dir=$(xcode-select -p)
          echo "xcode-select: ${developer_dir}"
          xcodebuild -version
          pkgutil --pkg-info=com.apple.pkg.CLTools_Executables || true

          echo "=== Installed macOS SDKs ==="
          xcodebuild -showsdks | grep -i 'macos' || true
          ls -l /Library/Developer/CommandLineTools/SDKs || true
          clt_libsystem=/Library/Developer/CommandLineTools/SDKs/MacOSX.sdk/usr/lib/libSystem.tbd
          if [ -f "${clt_libsystem}" ]; then
            echo "Command Line Tools libSystem.tbd lists arm64e.x1:" \
              "$(grep -c 'arm64e\.x1' "${clt_libsystem}" || true) line(s)"
          fi

          sdk=$(xcrun --sdk macosx --show-sdk-path)
          sdk_version=$(xcrun --sdk macosx --show-sdk-version)
          echo "Active Xcode macOS SDK: ${sdk} (${sdk_version})"

          case "${sdk}" in
            "${developer_dir}"/Platforms/MacOSX.platform/Developer/SDKs/*)
              ;;
            *)
              echo "error: xcrun did not resolve a macOS SDK inside the selected Xcode (${developer_dir}): ${sdk}" >&2
              exit 1
              ;;
          esac

          case "${sdk_version}" in
            26.*)
              ;;
            *)
              echo "error: macOS SDK ${sdk_version} is not a 26.x SDK; GNAT 16.1.0's bundled linker cannot read newer SDK stubs" >&2
              exit 1
              ;;
          esac

          libsystem="${sdk}/usr/lib/libSystem.tbd"
          if [ ! -f "${libsystem}" ]; then
            echo "error: ${libsystem} is missing" >&2
            exit 1
          fi
          sed -n '1,8p' "${libsystem}"
          if grep -q 'arm64e\.x1' "${libsystem}"; then
            echo "error: ${libsystem} lists arm64e.x1, which GNAT 16.1.0's bundled linker rejects" >&2
            exit 1
          fi

          echo "SDKROOT=${sdk}" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=${sdk}/usr/lib" >> "$GITHUB_ENV"

      - name: Verify the GNAT linker with the selected SDK
        run: |
          set -eu

          # Fails unless the linker trace shows libSystem loaded from the
          # selected SDK, with no Command Line Tools SDK file and no
          # rejected stub.
          check_link_trace() {
            if grep -nE 'malformed file|unknown architecture' "$1"; then
              echo "error: the linker rejected an SDK stub" >&2
              return 1
            fi
            if ! grep -F "${SDKROOT}/usr/lib/libSystem" "$1"; then
              echo "error: the linker trace does not show libSystem from ${SDKROOT}" >&2
              return 1
            fi
            if grep -n '/Library/Developer/CommandLineTools/SDKs/' "$1"; then
              echo "error: the linker loaded a Command Line Tools SDK file" >&2
              return 1
            fi
          }

          probe_root="${RUNNER_TEMP}/gnat-sdk-probe"
          rm -rf "${probe_root}"
          mkdir -p "${probe_root}"
          cd "${probe_root}"
          alr -n -q init --bin sdk_probe >/dev/null
          cd sdk_probe
          cat > src/sdk_probe.adb <<'EOF'
          with Ada.Command_Line;
          with Ada.Numerics.Long_Elementary_Functions;
          with Ada.Text_IO;

          procedure Sdk_Probe is
             use Ada.Numerics.Long_Elementary_Functions;
             X : constant Long_Float :=
               Long_Float (Ada.Command_Line.Argument_Count) + 0.5;
          begin
             Ada.Text_IO.Put_Line ("linked: sin =" & Long_Float'Image (Sin (X)));
          end Sdk_Probe;
          EOF

          echo "=== GNAT toolchain ==="
          alr -n exec -- gnat --version | head -1
          alr -n exec -- gprbuild --version | head -1
          gnat_ld=$(alr -n exec -- gcc -print-prog-name=ld)
          echo "GNAT linker: ${gnat_ld}"
          "${gnat_ld}" -v 2>&1 | head -2 || true
          echo "GNAT sysroot without SDKROOT:" \
            "$(env -u SDKROOT -u LIBRARY_PATH alr -n exec -- gcc -print-sysroot)"
          echo "GNAT sysroot with SDKROOT: $(alr -n exec -- gcc -print-sysroot)"

          # Control: the same link with the GNAT driver's default sysroot.
          # Its result classifies this runner image and does not fail the job.
          echo "=== Control: GNAT default sysroot ==="
          default_log="${RUNNER_TEMP}/sdk-probe-default.log"
          if env -u SDKROOT -u LIBRARY_PATH \
            alr -n build -- -f -largs -Wl,-t > "${default_log}" 2>&1
          then
            echo "::notice title=macOS SDK control::The GNAT default sysroot links on this runner image; it does not show GNAT-FSF-builds#112"
          else
            echo "::notice title=macOS SDK control::The GNAT default sysroot fails to link on this runner image (GNAT-FSF-builds#112)"
          fi
          grep -nE 'libSystem|malformed file|unknown architecture|arm64e' "${default_log}" || true

          echo "=== GNAT link with ${SDKROOT} ==="
          selected_log="${RUNNER_TEMP}/sdk-probe-selected.log"
          if ! alr -n build -- -f -largs -Wl,-t > "${selected_log}" 2>&1; then
            cat "${selected_log}"
            echo "error: a minimal Ada program does not link with ${SDKROOT}" >&2
            exit 1
          fi
          check_link_trace "${selected_log}"
          ./bin/sdk_probe
          otool -l bin/sdk_probe | grep -A4 LC_BUILD_VERSION
          otool -L bin/sdk_probe

      - name: Report OpenCV and C++ compilers
        run: |
          set -eu

          pkg-config --modversion opencv5 2>/dev/null || \
          pkg-config --modversion opencv4 2>/dev/null || \
          pkg-config --modversion opencv

          echo "=== Alire g++ ==="
          alr exec -- which g++ || true
          alr exec -- g++ --version || true

          echo "=== Apple clang++ ==="
          xcrun --find clang++
          xcrun clang++ --version

      - name: Select and verify exact Core release
        run: |
          test "$(git -C ../core rev-parse HEAD)" = "${{ matrix.core.commit }}"
          alr -n pin opencv_core --use=../core
          alr -n with --solve
          alr -n -C tests with --solve
          alr -n -C tests exec -- sh -c \
            'test "$(git -C "$OPENCV_CORE_ALIRE_PREFIX" rev-parse HEAD)" = "${{ matrix.core.commit }}"'

      - name: Build Geometry
        run: alr -n build

      - name: Verify Geometry shim isolation
        run: |
          set -eu

          shim_dylib=""

          for candidate in \
            lib/libopencv_geometry_shim.dylib \
            lib/libopencv_geometry_shim.*.dylib
          do
            if [ -e "${candidate}" ]; then
              shim_dylib="${candidate}"
              break
            fi
          done

          if [ -z "${shim_dylib}" ]; then
            echo "error: libopencv_geometry_shim*.dylib is missing" >&2
            ls -l lib
            exit 1
          fi

          grep 'OpenCV_Major := "5"' config/opencv_geometry_install.gpr
          grep 'Native_Geometry_Module := "geometry"' config/opencv_geometry_install.gpr
          echo "Found: ${shim_dylib}"
          grep 'Shim_Build : Shim_Build_Kind := "External_Relocatable"' \
            config/opencv_geometry_install.gpr
          grep 'Cxx_Toolchain : Cxx_Toolchain_Kind := "Apple_Clang"' \
            config/opencv_geometry_install.gpr
          cxx_driver=$(sed -n 's/.*Cxx_Driver := "\(.*\)";/\1/p' \
            config/opencv_geometry_install.gpr)
          case "$cxx_driver" in
            *gnat_native*)
              echo "error: C++ driver resolved to the GNAT toolchain: $cxx_driver" >&2
              exit 1
              ;;
          esac

          if otool -L "${shim_dylib}" | grep -E 'libopencv_(imgproc\.|core_shim)'; then
            echo "error: Geometry shim dylib depends on libopencv_imgproc or libopencv_core_shim" >&2
            otool -L "${shim_dylib}"
            exit 1
          fi

          otool -D "${shim_dylib}"
          shim_id=$(otool -D "${shim_dylib}" | sed -n '2p')
          if [ "${shim_id}" != "@rpath/libopencv_geometry_shim.dylib" ]; then
            echo "error: Geometry shim install name is not @rpath/libopencv_geometry_shim.dylib: ${shim_id}" >&2
            exit 1
          fi

          otool -L "${shim_dylib}"

          otool -L "${shim_dylib}" |
            grep -E 'libopencv_geometry\.'

          otool -L "${shim_dylib}" |
            grep -E 'libopencv_core\.'

          otool -L "${shim_dylib}" |
            grep -E 'libc\+\+'

          if otool -L "${shim_dylib}" |
            grep -E 'libstdc\+\+'
          then
            echo "error: Geometry shim dylib depends on libstdc++" >&2
            exit 1
          fi

      # The AUnit test executable is the link that GNAT-FSF-builds#112
      # breaks. Link it with a linker trace and require libSystem from the
      # selected SDK before running the suite.
      - name: Link Geometry tests against the selected SDK
        run: |
          set -eu
          link_log="${RUNNER_TEMP}/geometry-tests-link.log"
          if ! alr -n -C tests build -- -largs -Wl,-t > "${link_log}" 2>&1; then
            cat "${link_log}"
            echo "error: the Geometry tests do not link with ${SDKROOT}" >&2
            exit 1
          fi
          if grep -nE 'malformed file|unknown architecture' "${link_log}"; then
            echo "error: the linker rejected an SDK stub" >&2
            exit 1
          fi
          if ! grep -F "${SDKROOT}/usr/lib/libSystem" "${link_log}"; then
            cat "${link_log}"
            echo "error: the linker trace does not show libSystem from ${SDKROOT}" >&2
            exit 1
          fi
          if grep -n '/Library/Developer/CommandLineTools/SDKs/' "${link_log}"; then
            echo "error: the linker loaded a Command Line Tools SDK file" >&2
            exit 1
          fi
          otool -l tests/bin/tests | grep -A4 LC_BUILD_VERSION

      - name: Run Geometry tests
        run: |
          set +e
          set -o pipefail
          alr -n -C tests run 2>&1 | tee geometry-tests.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            failures=$(grep -E '^FAIL |^    ' geometry-tests.log | tr '\n' ' ')
            echo "::error title=Geometry test failure::${failures}"
            exit "$status"
          fi

  windows-x86_64-msys2:
    name: Windows x86_64 (MSYS2) / Core 0.5.0
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: geometry

    steps:
      - name: Checkout Geometry
        uses: actions/checkout@v4
        with:
          path: geometry

      - name: Checkout Core
        uses: actions/checkout@v4
        with:
          repository: zackboll/opencv_core_ada
          ref: f8aef00c5366b4275ccd3d934f9c73ea5b83cd4f
          path: core

      - name: Verify two-checkout layout
        run: |
          set -eu
          test -f ../core/alire.toml
          echo "Geometry: $(git rev-parse HEAD)"
          echo "Core:    $(git -C ../core rev-parse HEAD)"
          uname -a

      - name: Set up Alire
        uses: alire-project/setup-alire@latest
        with:
          version: "2.1.1"
          toolchain: "gnat_native gprbuild"
          msys2: true

      - name: Select Ada toolchain
        run: |
          set -eu
          alr -n --force toolchain --select \
            gnat_native=16.1.0 \
            gprbuild=26.0.1
          alr toolchain

      - name: Install MSYS2 OpenCV and C++ toolchain
        run: |
          set -eu

          # Alire's MSYS2 comes from the Alire cache, so the packages it has
          # already installed can predate the current package database.
          # Refreshing with a bare -Sy and then installing is a partial
          # upgrade and can break exact-version dependencies (for example
          # cc-libs pinning libgcc). Upgrade the whole system instead. The
          # first pass may update only pacman and the MSYS2 runtime, after
          # which pacman terminates its own MSYS2 processes; that pass is
          # therefore allowed to end nonzero. The second, fresh pass
          # completes the upgrade and must succeed.
          if ! alr exec -- pacman -Syu --noconfirm; then
            echo "First MSYS2 upgrade pass ended nonzero (core update)"
          fi
          alr exec -- pacman -Syu --noconfirm

          # The database is current after the full upgrade, so install
          # without a separate refresh.
          alr exec -- pacman -S --noconfirm --needed \
            mingw-w64-x86_64-opencv \
            mingw-w64-x86_64-pkg-config \
            mingw-w64-x86_64-gcc

          alr exec -- pacman -Q \
            mingw-w64-x86_64-opencv \
            mingw-w64-x86_64-gcc \
            mingw-w64-x86_64-libgcc \
            mingw-w64-x86_64-libstdc++ \
            mingw-w64-x86_64-cc-libs
          alr exec -- pacman -Dk

      - name: Report OpenCV and compiler resolution
        run: |
          set -eu

          echo "=== Target pkg-config ==="
          alr exec -- x86_64-w64-mingw32-pkg-config --modversion opencv5

          echo "=== Generic pkg-config ==="
          command -v pkg-config || true
          where.exe pkg-config || true

          echo "=== Alire g++ ==="
          alr exec -- which g++ || true
          alr exec -- g++ --version || true

          echo "=== MSYS2 g++ ==="
          alr exec -- sh -c \
            'ls -l /mingw64/bin/g++.exe && /mingw64/bin/g++.exe --version'

      - name: Select and verify exact Core release
        run: |
          test "$(git -C ../core rev-parse HEAD)" = f8aef00c5366b4275ccd3d934f9c73ea5b83cd4f
          alr -n pin opencv_core --use=../core
          alr -n with --solve
          alr -n -C tests with --solve
          alr -n -C tests exec -- sh -c \
            'test "$(git -C "$OPENCV_CORE_ALIRE_PREFIX" rev-parse HEAD)" = f8aef00c5366b4275ccd3d934f9c73ea5b83cd4f'

      - name: Build Geometry
        run: alr -n build

      - name: Verify external Geometry shim
        run: |
          set -eu
          config=config/opencv_geometry_install.gpr
          cat "$config"
          grep 'OpenCV_Major := "5"' "$config"
          grep 'Native_Geometry_Module := "geometry"' "$config"
          cxx_driver=$(sed -n 's/.*Cxx_Driver := "\(.*\)";/\1/p' "$config")
          case "$cxx_driver" in
            *gnat_native*) exit 1 ;;
            *mingw64*g++*) ;;
            *) echo "Unexpected C++ driver: $cxx_driver"; exit 1 ;;
          esac
          test -f lib/libopencv_geometry_shim.dll
          test -f lib/libopencv_geometry_shim.dll.a
          test -f obj/shim/external/opencv_geometry_shim.o
          dump="$(dirname "$cxx_driver")/objdump.exe"
          deps=$("$dump" -p lib/libopencv_geometry_shim.dll)
          printf '%s\n' "$deps"
          printf '%s\n' "$deps" | grep -Ei 'DLL Name: libopencv_geometry-.*\.dll'
          if printf '%s\n' "$deps" | grep -Ei 'DLL Name: libopencv_(imgproc|core_shim)'; then
            exit 1
          fi

      - name: Run Geometry tests
        run: |
          set +e
          set -o pipefail
          PATH="$PWD/lib:$PWD/../core/lib:/mingw64/bin:$PATH" \
            alr -n -C tests run 2>&1 | tee geometry-tests.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            failures=$(grep -E '^FAIL |^    ' geometry-tests.log | tr '\n' ' ')
            echo "::error title=Geometry test failure::${failures}"
            exit "$status"
          fi
